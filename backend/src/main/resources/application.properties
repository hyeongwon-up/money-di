spring.application.name=money-di-backend
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Do not silently truncate fractional JSON amounts when binding to Long.
spring.jackson.deserialization.accept-float-as-int=false
# Keep small foreign quantities exact and readable in JSON decimal strings.
spring.jackson.generator.write-bigdecimal-as-plain=true
